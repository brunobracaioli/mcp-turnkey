version: 2
updates:
  - package-ecosystem: pip
    directory: /template
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # mcp 2.x removed mcp.server.fastmcp: widening the cap crashes every route (ADR 0001).
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
