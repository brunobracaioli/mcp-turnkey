name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10" # the floor in requires-python; Vercel runs newer
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type-check (strict)
        run: mypy src

      - name: Test
        run: pytest -q

      - name: Dependency audit (SCA)
        run: pip-audit -r requirements.txt

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
